<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modified.</title>
  <style>
    :root {
      --yellow: #f5f500;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: var(--yellow);
      overflow: hidden;
    }

    .dress {
      position: absolute;
      top: 24px;
      left: 24px;
      width: min(18vw, 180px);
      height: auto;
      z-index: 2;
      pointer-events: none;
    }

    .logo {
      width: min(58vw, 620px);
      height: auto;
      display: block;
    }

    @media (max-width: 600px) {
      .dress {
        top: 14px;
        left: 14px;
        width: 105px;
      }
    }
  </style>
</head>
<body>
  <img class="dress" src="dress.svg" alt="Yellow dress from the Modified. poster">

  <svg class="logo" viewBox="0 0 620 150" role="img" aria-label="Modified.">
    <text x="310" y="108"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="92"
          font-weight="900"
          font-style="italic"
          letter-spacing="-5"
          fill="#000000">Modified.</text>
  </svg>
</body>
</html>
